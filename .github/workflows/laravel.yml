name: Laravel CI - Colegio de Arquitectos

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  laravel-tests:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.2' # Asegúrate que coincida con tu versión de PHP
        extensions: mbstring, xml, ctype, iconv, intl, pdo_pgsql # Agregué pgsql por tu DB

    - name: Install Dependencies
      run: composer install --prefer-dist --no-progress --no-suggest

    - name: Copy .env
      run: php -r "file_exists('.env') || copy('.env.example', '.env');"

    - name: Generate key
      run: php artisan key:generate

    - name: Directory Permissions
      run: chmod -R 777 storage bootstrap/cache

    - name: Check for Syntax Errors (Lint)
      run: find . -name "*.php" -not -path "./vendor/*" | xargs -n 1 -P 8 php -l
